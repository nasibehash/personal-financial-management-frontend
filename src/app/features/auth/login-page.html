<div class="card">
  <div class="brand"><span class="logo" aria-hidden="true">₮</span> مدیریت مالی شخصی</div>
  <h1>ورود به حساب</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <div class="alert alert-error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="email">ایمیل</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        dir="ltr"
        [class.invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">یک ایمیل معتبر وارد کنید.</span>
      }
    </div>

    <div class="field">
      <label for="password">رمز عبور</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        dir="ltr"
        [class.invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">رمز عبور را وارد کنید.</span>
      }
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="busy()">
      {{ busy() ? 'در حال ورود…' : 'ورود' }}
    </button>
  </form>

  <p class="switch muted">حساب ندارید؟ <a routerLink="/register">ثبت‌نام</a></p>
</div>
